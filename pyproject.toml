[project]
name = "swe"
dynamic = ["version"]
description = "SWE is a **personal assistant** that runs in your own environment. It talks to you over multiple channels (DingTalk, Feishu, QQ, Discord, iMessage, etc.) and runs scheduled tasks according to your configuration. **What it can do is driven by Skills — the possibilities are open-ended.** Built-in skills include cron, PDF/Office handling, news digest, file reading, and more; you can add custom skills. All data and tasks run on your machine; no third-party hosting."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "agentscope==1.0.18",
    "agentscope-runtime==1.1.3",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    "uvicorn>=0.40.0",
    "uvloop>=0.22.0; sys_platform != 'win32'",
    "croniter>=2.0.0,<7",
    "playwright>=1.49.0",
    "questionary>=2.1.1",
    "mss>=9.0.0",
    "reme-ai==0.3.1.8",
    "transformers>=4.30.0",
    "python-dotenv>=1.0.0",
    "python-socks>=2.5.3",
    "twilio>=9.10.2",
    "pywebview>=4.0",
    "aiofiles>=24.1.0",
    "matrix-nio>=0.24.0",
    "shortuuid>=1.0.0",
    "google-genai>=1.67.0",
    "tzdata>=2024.1",
    "pyyaml>=6.0",
    "json-repair>=0.58.7",
    "jsonschema>=4.26.0",
    "segno>=1.6.6",
    "modelscope>=1.35.0",
    "huggingface_hub>=0.20.0",
    "requests>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.0.0",
    "pandas>=2.0.0",
    # anyio 4.13.0: _deliver_cancellation busy-loop / getpid storm (CoPaw#2632)
    "anyio>=4.0.0,<4.13.0",
    "boto3>=1.24.1",
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "objgraph>=3.6.0",
    "pympler>=1.1",
    # Redis for cron coordination (multi-instance support)
    "redis>=5.0.0",
    # Elasticsearch for model output storage (7.x client for ES 6.x server compat)
    # "elasticsearch[async]==7.17.9",
    "LR34.05-AgentTraceSDK==0.2.2",
]

[tool.setuptools.dynamic]
version = {attr = "swe.__version__.__version__"}

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
# Dockerfile copies console build output to src/swe/console/ (no dist subdir).
"swe" = [
    "console/**",
    "agents/md_files/**",
    "agents/skills/**",
    "tokenizer/**",
    "security/tool_guard/rules/**",
    "security/skill_scanner/rules/**",
    "security/skill_scanner/data/**",
    "config/envs/*.json",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
swe = "swe.cli.main:cli"

[project.optional-dependencies]
mysql = [
    "mysql-connector-python==26.7.0",
]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=4.2.0",
    "pytest-cov>=6.2.1",
    "hypothesis>=6.0.0",
    "python-pptx>=0.6.23",
]
local = [
    "huggingface_hub>=0.20.0",
]
llamacpp = [
    "swe[local]",
    "llama-cpp-python>=0.3.0",
]
mlx = [
    "swe[local]",
    "mlx-lm>=0.10.0; sys_platform == 'darwin'",
]
ollama = [
    "ollama>=0.6.1",
]
whisper = [
    "openai-whisper>=20231117",
]
full = [
    "swe[local,ollama,llamacpp,whisper]",
    "mlx-lm>=0.10.0; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pylint.refactoring]
max-nested-blocks = 5

[tool.pylint.'CLASSES']
max-public-methods = 25
